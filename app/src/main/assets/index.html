<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#f8faf9">
  <title>侧语 · 对话工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="rail">
    <a class="brand" href="#session" aria-label="侧语首页"><span class="brand-icon"><i data-lucide="messages-square"></i></span><span>侧语<small>CEYU</small></span></a>

    <div class="rail-bottom"><i data-lucide="shield-check"></i><span>本机加密档案<small>你的关系，由你定义</small></span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="mobile-brand">侧语<span class="brand-dot"></span></span><div class="breadcrumb">个人空间 <span>/</span> <b id="page-name">对话工作台</b></div><button class="connection" data-action="settings"><span class="dot"></span><span id="connection-label">尚未连接模型</span><i data-lucide="chevron-right"></i></button></header>
    <main id="main"></main>
    <footer class="desktop-footer"><span>侧语 0.1 <span class="separator">/</span> ONLINE FIRST</span><span id="runtime-label">Android 线上模式</span></footer>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="底部导航"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
